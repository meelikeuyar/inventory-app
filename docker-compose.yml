services:
  mongodb:
    image: mongo:7
    container_name: inventory-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: inventory-app
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-inventoryAdmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    deploy:
      resources:
        limits:
          memory: 256M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: inventory-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
      - redis
    deploy:
      resources:
        limits:
          memory: 512M

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: inventory-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongo-data:
  redis-data:
