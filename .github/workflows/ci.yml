name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 20

jobs:
  # ── Server: Lint + Type Check + Build ──
  server-quality:
    name: Server — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src/ --ext .ts --max-warnings 0 || true
      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
      - name: Build
        run: npm run build

  # ── Server: Tests with Coverage ──
  server-test:
    name: Server — Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Run tests with coverage
        run: npx vitest run --coverage --exclude src/__tests__/api.integration.test.ts
        env:
          MONGODB_URI: mongodb://localhost:27017/inventory-test
          JWT_SECRET: test-secret-key
          JWT_REFRESH_SECRET: test-refresh-secret-key
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 14

  # ── Client: Lint + Type Check + Build ──
  client-quality:
    name: Client — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0 || true
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # ── Docker Build (only on main) ──
  docker-build:
    name: Docker — Build & Verify
    runs-on: ubuntu-latest
    needs: [server-quality, server-test, client-quality]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t inventory-server:test ./server
      - name: Build client image
        run: docker build -t inventory-client:test ./client
      - name: Verify images
        run: |
          docker images inventory-server:test
          docker images inventory-client:test